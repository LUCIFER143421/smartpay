services:
  - type: web
    name: smartpay-api
    env: docker
    rootDir: smartpay
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: smartpay-db
          property: jdbcConnectionString
      - key: DB_USERNAME
        fromDatabase:
          name: smartpay-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smartpay-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"

databases:
  - name: smartpay-db
    databaseName: smartpay
    user: smartpay_user
    plan: free